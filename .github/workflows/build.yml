name: Build LR Site Tracker APK

on:
  push:
    branches: [ "lr-site-tracker-apk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LR-Site-Tracker-v1.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Site-Tracker-APK
          path: dist/LR-Site-Tracker-v1.0.apk
          if-no-files-found: error
