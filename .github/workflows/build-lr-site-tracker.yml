name: Build LR Site Tracker APK

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-site-tracker:
    if: github.head_ref == 'lr-site-tracker-apk' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LR-Site-Tracker-v1.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Site-Tracker-APK
          path: dist/LR-Site-Tracker-v1.0.apk
          if-no-files-found: error
