name: LR Campus Emulator Smoke

on:
  push:
    branches: ["lr-campus-automation"]
    paths:
      - "apps/LR-Campus-Automation/project/**"
      - ".github/scripts/lr-campus-emulator-smoke.sh"
      - ".github/workflows/lr-campus-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build LR app and fake CPDaily
        working-directory: apps/LR-Campus-Automation/project
        run: gradle --no-daemon :app:assembleDebug :fixture-cpdaily:assembleDebug

      - name: Run real Android record/replay smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          script: bash .github/scripts/lr-campus-emulator-smoke.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lr-campus-emulator-diagnostics
          path: |
            /tmp/window.xml
            /tmp/prefs.xml
          if-no-files-found: ignore
          retention-days: 7
