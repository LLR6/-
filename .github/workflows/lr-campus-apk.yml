name: Build LR Campus APK

on:
  push:
    branches: ["lr-campus-automation"]
    paths:
      - "apps/LR-Campus-Automation/**"
      - ".github/workflows/lr-campus-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: |
          rm -rf /tmp/lr-campus
          mkdir -p /tmp/lr-campus
          unzip -q apps/LR-Campus-Automation/LR-Campus-Automation.zip -d /tmp/lr-campus

      - name: Build debug APK
        working-directory: /tmp/lr-campus/LR-Campus-Automation
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LR-Campus-Automation-debug
          path: /tmp/lr-campus/LR-Campus-Automation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
