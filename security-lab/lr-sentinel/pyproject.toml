[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-sentinel"
version = "0.1.0"
description = "Explainable defensive event detector for learning and portfolio use"
requires-python = ">=3.11"

[project.scripts]
lr-sentinel = "lr_sentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
