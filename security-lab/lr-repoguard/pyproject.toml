[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-repoguard"
version = "0.1.0"
description = "Defensive repository, secret-hygiene and CI security scanner"
requires-python = ">=3.11"

[project.scripts]
lr-repoguard = "lr_repoguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
